# Live-test for the X-Desktop feature: a heavyweight GUI client. kos-server
# exec-launches "firefox" with DISPLAY/XAUTHORITY into it; the browser renders
# in the kOS desktop via the kos-xserver display pool.
# ---
# Firefox's resources dwarf the xclock test pod (it is the point of this
# pod), so requests/limits are scaled accordingly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox-test
  namespace: kos
  labels:
    app.kubernetes.io/name: firefox-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firefox-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firefox-test
      annotations:
        # command kos-server runs in this pod for "Open GUI app"
        kos.dev/x-app: 'firefox'
    spec:
      containers:
        - name: app
          image: ghcr.io/gbozo/firefox-test:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
