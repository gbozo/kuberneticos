# Live-test for the X-Desktop feature: a stock pod carrying the X-app
# annotation. kos-server exec-launches "xclock" with DISPLAY/XAUTHORITY into
# it; the GUI renders in the kOS desktop via the kos-xserver display pool.
# ---
# xclock needs nothing preinstalled beyond this image's X11 client libs and
# the xauth cookie that kos-server ships in through the exec session.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xclock-test
  namespace: kos
  labels:
    app.kubernetes.io/name: xclock-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xclock-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xclock-test
      annotations:
        # command kos-server runs in this pod for "Open GUI app"
        kos.dev/x-app: 'xclock'
    spec:
      containers:
        - name: app
          image: ghcr.io/gbozo/xclock-test:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
