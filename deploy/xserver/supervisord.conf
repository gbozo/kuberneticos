; kos-xserver supervisord base configuration.
;
; IMPORTANT — this file is the *base template* only. It contains no display
; programs. entrypoint.sh copies it to /kos/supervisord-runtime.conf at boot
; and *appends* one program triple per display in the pool, in this shape
; (generated block, kept here for reference; the runtime file is the real conf):
;
;   [program:xvfb-21]
;   command=Xvfb :21 -listen tcp -auth /kos/.Xauthority -screen 0 1920x1080x24
;   autorestart=true
;
;   [program:openbox-21]
;   environment=DISPLAY=":21",XAUTHORITY="/kos/.Xauthority"
;   command=openbox --display :21
;   autorestart=true
;
;   [program:vnc-21]
;   environment=XAUTHORITY="/kos/.Xauthority"
;   command=x11vnc -display :21 -rfbport 5921 -listen 0.0.0.0 -forever -shared -nopw
;   autorestart=true
;
; All sections below are required INI boilerplate (valid per supervisord docs)
; and everything runs as the non-root kos user (uid 1000), so all paths stay
; under /kos and use unprivileged ports.

[unix_http_server]
file=/kos/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/kos/supervisord.log
pidfile=/kos/supervisord.pid
childlogdir=/kos

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///kos/supervisor.sock
